name: Testes do banco (Supabase) e modelos Dart

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar-schema:
    name: Testar schema e RLS num Postgres temporário
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@v4
      - name: Migração e schema.sql são idênticos
        run: cmp supabase/schema.sql supabase/migrations/20261122000001_init_anotei_ja.sql
      - name: Aplicar schema e migrações (duas vezes, para provar que são idempotentes) e testar RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase_grants.sql
          for f in $(ls supabase/migrations/*.sql | sort | tail -n +2); do
            psql -v ON_ERROR_STOP=1 -f "$f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql

  testar-modelos:
    name: Analisar e testar modelos Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::formatação diferente do dart format"
      - run: dart analyze --fatal-infos
      - run: dart test

