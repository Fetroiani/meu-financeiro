name: Banco (Supabase) e modelos Dart

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/anotei_ja_models/**"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "packages/anotei_ja_models/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar-schema:
    name: Testar schema e RLS num Postgres temporário
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@v4
      - name: Migração e schema.sql são idênticos
        run: cmp supabase/schema.sql supabase/migrations/20261122000001_init_anotei_ja.sql
      - name: Aplicar schema (duas vezes, para provar que é idempotente) e testar RLS
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/auth_stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql

  testar-modelos:
    name: Analisar e testar modelos Dart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/anotei_ja_models
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::formatação diferente do dart format"
      - run: dart analyze --fatal-infos
      - run: dart test

  deploy:
    name: Aplicar migrações no Supabase
    needs: [testar-schema, testar-modelos]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        id: seg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Segredos do Supabase ainda não cadastrados; deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.seg.outputs.ok == 'true'
        with:
          version: latest
      - name: Vincular projeto e aplicar migrações
        if: steps.seg.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
