name: Publicar funções do Supabase

# Publica a função "nfce" (lê os produtos da nota fiscal no site da Sefaz).
# Só roda se o segredo SUPABASE_ACCESS_TOKEN estiver cadastrado no GitHub;
# sem ele, a função pode ser publicada colando o código no painel do Supabase.
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Sem token, nada a fazer
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "Cadastre SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF nos segredos do GitHub para publicar automaticamente."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Publicar a função nfce
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy nfce --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
